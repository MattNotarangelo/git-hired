[project]
name = "git-hired"
version = "0.2.0"
description = "Generate a shell script that fills your GitHub contribution graph between two dates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Notarangelo" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Repository = "https://github.com/MattNotarangelo/git-hired"

[project.scripts]
git-hired = "git_hired.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4.1",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=git_hired", "--cov-report=term-missing"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
